<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question for My Cupcake ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    /* =========================================
       FIRST PAGE
    ========================================= */
    .first-page {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(circle at 20% 20%, #ffd6df, transparent 30%),
            linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
        position: relative;
    }

    .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        width: 350px;
        max-width: 90%;
        z-index: 10;
    }

    .card h1 { color: #ff4d6d; margin-bottom: 10px; font-family: "Playfair Display", Georgia, serif; }
    .card p { color: #555; }

    .button-container { display: flex; justify-content: center; gap: 20px; margin-top: 25px; }

    button { border: none; border-radius: 14px; padding: 13px 25px; font-size: 17px; cursor: pointer; transition: 0.3s; font-family: inherit; }

    .yes { background: #28a745; color: white; }
    .yes:hover { transform: scale(1.08); }
    .no { background: #dc3545; color: white; }

    .heart {
        position: absolute;
        bottom: -50px;
        color: #ff4d6d;
        pointer-events: none;
        animation: fly 7s linear forwards;
        z-index: 1;
    }

    @keyframes fly {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }

    /* =========================================
       DATE PLANNER
    ========================================= */
    .planner-page {
        min-height: 100vh;
        width: 100%;
        overflow-y: auto;
        padding: 40px 20px;
        position: relative;
        background:
            radial-gradient(circle at 10% 10%, rgba(255,255,255,0.2), transparent 25%),
            radial-gradient(circle at 90% 80%, rgba(255,200,220,0.25), transparent 30%),
            linear-gradient(135deg, #1d1235, #3b1c4d, #742957, #c94b73);
    }

    .moon {
        position: absolute; width: 120px; height: 120px; border-radius: 50%;
        background: #fff4c2; top: 45px; right: 9%;
        box-shadow: 0 0 30px #fff4c2, 0 0 80px rgba(255,244,194,0.3);
    }
    .moon::after {
        content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%;
        background: #2b1741; left: 35px; top: -15px;
    }

    .star { position: absolute; color: white; animation: sparkle 3s infinite; opacity: 0.7; }
    @keyframes sparkle { 0%,100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.3); } }
    .star:nth-child(2) { top: 15%; left: 10%; }
    .star:nth-child(3) { top: 25%; left: 25%; animation-delay: 1s; }
    .star:nth-child(4) { top: 12%; left: 50%; animation-delay: 2s; }
    .star:nth-child(5) { top: 40%; right: 10%; animation-delay: .5s; }
    .star:nth-child(6) { bottom: 20%; left: 8%; animation-delay: 1.5s; }
    .star:nth-child(7) { bottom: 10%; right: 15%; animation-delay: 2.5s; }

    .planner { position: relative; z-index: 10; max-width: 900px; margin: auto; color: white; }
    .planner-header { text-align: center; margin-bottom: 30px; }
    .planner-header .small { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.7; }
    .planner-header h1 { font-family: "Playfair Display", Georgia, serif; font-size: 48px; margin: 10px 0; color: white; }
    .planner-header p { color: #ffe6ed; font-size: 18px; }

    .date-section {
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 25px;
        padding: 25px;
        margin-bottom: 25px;
    }

    .section-title { font-size: 20px; margin-bottom: 15px; }

    .date-input {
        width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 18px;
        background: rgba(255,255,255,0.95); color: #4b2148; cursor: pointer; font-family: inherit;
    }
    .date-input:focus { outline: 3px solid rgba(255,255,255,0.3); }

    .places { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }

    .place-card {
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 18px;
        padding: 20px 15px;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s ease;
    }
    .place-card:hover { transform: translateY(-6px); background: rgba(255,255,255,0.22); }
    .place-card.selected {
        background: #ff4d6d; border-color: white;
        box-shadow: 0 10px 30px rgba(255,77,109,0.4);
        transform: translateY(-5px);
    }

    .place-icon { font-size: 32px; display: block; margin-bottom: 8px; }
    .place-name { font-size: 14px; font-weight: bold; }

    .message-box {
        width: 100%; height: 130px; resize: none; border: none; border-radius: 18px;
        padding: 18px; font-family: inherit; font-size: 16px;
        background: rgba(255,255,255,0.95); color: #4b2148;
    }
    .message-box:focus { outline: 3px solid rgba(255,255,255,0.3); }

    .confirm-button {
        width: 100%; padding: 18px; border-radius: 18px;
        background: linear-gradient(135deg, #ff4d6d, #ff7b9c);
        color: white; font-size: 20px; font-weight: bold;
        box-shadow: 0 10px 30px rgba(255,77,109,0.35);
        font-family: inherit;
    }
    .confirm-button:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255,77,109,0.5); }

    /* =========================================
       SUCCESS — TICKET REVEAL
    ========================================= */
    .success-page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 20px;
        color: white;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 0%, #4a2258, transparent 55%),
            linear-gradient(160deg, #1d1235, #3b1c4d 45%, #742957 80%, #c94b73);
    }

    .confetti-piece {
        position: absolute;
        top: -20px;
        opacity: 0;
        pointer-events: none;
        border-radius: 2px;
        animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
        0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(105vh) rotate(540deg); opacity: 0.9; }
    }

    .success-wrap {
        position: relative;
        z-index: 5;
        animation: wrapIn .7s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes wrapIn {
        from { opacity: 0; transform: translateY(30px) scale(.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .eyebrow {
        font-size: 13px;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #ffcfe0;
        opacity: 0.85;
        margin-bottom: 14px;
    }

    /* --- the ticket --- */
    .ticket {
        position: relative;
        width: 460px;
        max-width: 90vw;
        margin: 0 auto;
        background: #fdf6ec;
        color: #3a1330;
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.45);
        display: flex;
        text-align: left;
        transform: rotate(-1.2deg);
        animation: ticketSettle .9s .15s cubic-bezier(.17,.84,.44,1) both;
    }

    @keyframes ticketSettle {
        0%   { opacity: 0; transform: rotate(-10deg) translateY(-40px) scale(.85); }
        60%  { opacity: 1; }
        100% { opacity: 1; transform: rotate(-1.2deg) translateY(0) scale(1); }
    }

    .ticket-main {
        flex: 1;
        padding: 26px 22px;
        position: relative;
    }

    .ticket-brand {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 15px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #b5486a;
        margin-bottom: 4px;
    }

    .ticket-title {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.15;
        margin: 2px 0 16px;
        color: #3a1330;
    }

    .ticket-row {
        display: flex;
        gap: 22px;
        margin-bottom: 14px;
    }

    .ticket-field .label {
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #9c7b8c;
        margin-bottom: 3px;
    }

    .ticket-field .value {
        font-size: 15px;
        font-weight: 600;
        color: #3a1330;
    }

    .ticket-note {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px dashed #d9c3ce;
        font-family: "Caveat", cursive;
        font-size: 21px;
        line-height: 1.35;
        color: #7a2b4f;
    }

    .ticket-note .label {
        font-family: "Inter", sans-serif;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #9c7b8c;
        margin-bottom: 4px;
        display: block;
    }

    .stamp {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 84px;
        height: 84px;
        border: 3px solid #b5486a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #b5486a;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 1px;
        text-align: center;
        text-transform: uppercase;
        transform: rotate(14deg) scale(0);
        opacity: 0;
        animation: stampHit .35s .95s cubic-bezier(.36,1.8,.5,1) forwards;
    }

    @keyframes stampHit {
        0%   { transform: rotate(14deg) scale(2.4); opacity: 0; }
        60%  { opacity: 1; }
        100% { transform: rotate(14deg) scale(1); opacity: 0.9; }
    }

    .ticket-stub {
        width: 120px;
        flex-shrink: 0;
        border-left: 2px dashed #d9c3ce;
        padding: 22px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        position: relative;
    }

    .ticket-stub::before,
    .ticket-stub::after {
        content: "";
        position: absolute;
        left: -13px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #742957;
    }
    .ticket-stub::before { top: -13px; }
    .ticket-stub::after { bottom: -13px; }

    .countdown-number {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 40px;
        font-weight: 700;
        color: #3a1330;
        line-height: 1;
    }

    .countdown-label {
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #9c7b8c;
        text-align: center;
    }

    .stub-heart { font-size: 22px; }

    .success-footer {
        margin-top: 30px;
        font-size: 19px;
        color: #ffe6ed;
        font-style: italic;
        font-family: "Playfair Display", Georgia, serif;
    }

    /* =========================================
       MOBILE
    ========================================= */
    @media (max-width: 700px) {
        .planner-header h1 { font-size: 36px; }
        .places { grid-template-columns: repeat(2, 1fr); }
        .moon { width: 70px; height: 70px; right: 5%; }
        .moon::after { width: 70px; height: 70px; }
    }

    @media (max-width: 450px) {
        .planner-page { padding: 25px 15px; }
        .places { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .place-card { padding: 15px 8px; }
        .place-icon { font-size: 26px; }
        .place-name { font-size: 12px; }
        .ticket { flex-direction: column; width: 320px; }
        .ticket-stub {
            width: 100%;
            border-left: none;
            border-top: 2px dashed #d9c3ce;
            flex-direction: row;
            padding: 14px;
        }
        .ticket-stub::before { left: 50%; top: -13px; transform: translateX(-50%); }
        .ticket-stub::after { left: 50%; bottom: -13px; top: auto; transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
</head>
<body>

<!-- FIRST PAGE -->
<div class="first-page" id="firstPage">
    <div class="card">
        <h1>Hi Chamuuuu😊</h1>
        <p>I really enjoy talking with you My Cupcake🧁</p>
        <p>Would you like to go on a date with me? ❤️</p>
        <div class="button-container">
            <button class="yes" id="yesBtn">Yes 💖</button>
            <button class="no" id="noBtn">No 😶‍🌫️</button>
        </div>
    </div>
</div>

<script>
    /* =========================================
       TODAY'S DATE
    ========================================= */
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    const todayString = `${year}-${month}-${day}`;

    /* =========================================
       FLOATING HEARTS
    ========================================= */
    function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = ["❤️", "💕", "💗", "💖"][Math.floor(Math.random() * 4)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random() * 30) + "px";
        heart.style.animationDuration = (5 + Math.random() * 5) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 10000);
    }
    let heartInterval = setInterval(createHeart, 600);

    /* =========================================
       NO BUTTON
    ========================================= */
    const noBtn = document.getElementById("noBtn");

    function moveNoButton() {
        noBtn.style.position = "fixed";
        const maxX = Math.max(10, window.innerWidth - 130);
        const maxY = Math.max(10, window.innerHeight - 70);
        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);

    /* =========================================
       YES BUTTON
    ========================================= */
    document.getElementById("yesBtn").onclick = showPlanner;

    function showPlanner() {
        clearInterval(heartInterval);

        document.body.innerHTML = `
            <div class="planner-page">
                <div class="moon"></div>
                <div class="star">✦</div>
                <div class="star">✦</div>
                <div class="star">✦</div>
                <div class="star">✦</div>
                <div class="star">✦</div>
                <div class="star">✦</div>

                <div class="planner">
                    <div class="planner-header">
                        <div class="small">OUR LITTLE ADVENTURE</div>
                        <h1>Let's Make A Date 💕</h1>
                        <p>Pick a day, choose a place, and leave me a little note.</p>
                    </div>

                    <div class="date-section">
                        <div class="section-title">📅 When should we go?</div>
                        <input class="date-input" type="date" id="date" min="${todayString}">
                    </div>

                    <div class="date-section">
                        <div class="section-title">📍 Where should we go?</div>
                        <div class="places">
                            <div class="place-card" data-place="Cafe Kinross 🍬"><span class="place-icon">☕</span><span class="place-name">Cafe Kinross</span></div>
                            <div class="place-card" data-place="Wetland Park Beddgana 🏞️"><span class="place-icon">🌿</span><span class="place-name">Wetland Park Beddgana</span></div>
                            <div class="place-card" data-place="Movie Date 🍿"><span class="place-icon">🎬</span><span class="place-name">Movie Date</span></div>
                            <div class="place-card" data-place="Cafe Karabu 🍥"><span class="place-icon">🍰</span><span class="place-name">Cafe Karabu</span></div>
                            <div class="place-card" data-place="Hazel Cafe 🍧"><span class="place-icon">🍨</span><span class="place-name">Hazel Cafe</span></div>
                            <div class="place-card" data-place="Grind Cafe 🍬"><span class="place-icon">🧁</span><span class="place-name">Grind Cafe</span></div>
                            <div class="place-card" data-place="Kiku Colombo 🍧"><span class="place-icon">🍵</span><span class="place-name">Kiku Colombo</span></div>
                            <div class="place-card" data-place="Laluna Cafe 🍭"><span class="place-icon">🍓</span><span class="place-name">Laluna Cafe</span></div>
                            <div class="place-card" data-place="Cafe 1959 🍷"><span class="place-icon">🥂</span><span class="place-name">Cafe 1959</span></div>
                            <div class="place-card" data-place="Summar Colombo 🍬"><span class="place-icon">🌆</span><span class="place-name">Summar Colombo</span></div>
                            <div class="place-card" data-place="Latte Ceylon 🍭"><span class="place-icon">☕</span><span class="place-name">Latte Ceylon</span></div>
                            <div class="place-card" data-place="Cruste and Co Cafe 🍥"><span class="place-icon">🥐</span><span class="place-name">Cruste and Co Cafe</span></div>
                            <div class="place-card" data-place="Surprise Me ✨"><span class="place-icon">✨</span><span class="place-name">Surprise Me</span></div>
                        </div>
                    </div>

                    <div class="date-section">
                        <div class="section-title">💌 A little note for me?</div>
                        <textarea class="message-box" id="message" placeholder="Tell me something... 😊"></textarea>
                    </div>

                    <button class="confirm-button" id="confirmBtn">Confirm Our Date ❤️</button>
                </div>
            </div>
        `;

        setupPlanner();
    }

    /* =========================================
       PLANNER LOGIC
    ========================================= */
    function setupPlanner() {
        const placeCards = document.querySelectorAll(".place-card");
        let selectedPlace = "";

        placeCards.forEach(card => {
            card.addEventListener("click", () => {
                placeCards.forEach(item => item.classList.remove("selected"));
                card.classList.add("selected");
                selectedPlace = card.dataset.place;

                if (selectedPlace === "Surprise Me ✨") {
                    const places = [
                        "Cafe Kinross 🍬", "Wetland Park Beddgana 🏞️", "Movie Date 🍿",
                        "Cafe Karabu 🍥", "Hazel Cafe 🍧", "Grind Cafe 🍬",
                        "Kiku Colombo 🍧", "Laluna Cafe 🍭", "Cafe 1959 🍷",
                        "Summar Colombo 🍬", "Latte Ceylon 🍭", "Cruste and Co Cafe 🍥"
                    ];
                    selectedPlace = places[Math.floor(Math.random() * places.length)];
                    setTimeout(() => {
                        alert("✨ Surprise! Your date will be at " + selectedPlace);
                    }, 100);
                }
            });
        });

        document.getElementById("confirmBtn").onclick = function () {
            const date = document.getElementById("date").value;
            const message = document.getElementById("message").value.trim();

            if (!date) { alert("Choose a date for our adventure 😊"); return; }
            if (!selectedPlace) { alert("Pick a place for our date ❤️"); return; }

            showSuccess(date, selectedPlace, message);
        };
    }

    /* =========================================
       SUCCESS — TICKET REVEAL
    ========================================= */
    function formatPrettyDate(dateStr) {
        const [y, m, d] = dateStr.split("-").map(Number);
        const dateObj = new Date(y, m - 1, d);
        const options = { weekday: "long", month: "long", day: "numeric" };
        return dateObj.toLocaleDateString("en-US", options);
    }

    function daysUntil(dateStr) {
        const [y, m, d] = dateStr.split("-").map(Number);
        const target = new Date(y, m - 1, d);
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        target.setHours(0, 0, 0, 0);
        return Math.round((target - now) / 86400000);
    }

    function launchConfetti(container) {
        const colors = ["#ff4d6d", "#ffb6c8", "#fff4c2", "#c94b73", "#ffffff"];
        for (let i = 0; i < 60; i++) {
            const piece = document.createElement("div");
            piece.className = "confetti-piece";
            const size = 6 + Math.random() * 6;
            piece.style.width = size + "px";
            piece.style.height = (size * 0.4) + "px";
            piece.style.left = Math.random() * 100 + "vw";
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDuration = (2.5 + Math.random() * 2) + "s";
            piece.style.animationDelay = (Math.random() * 0.6) + "s";
            container.appendChild(piece);
            setTimeout(() => piece.remove(), 5500);
        }
    }

    function showSuccess(date, place, message) {
        const prettyDate = formatPrettyDate(date);
        const remaining = daysUntil(date);
        let countdownText, countdownLabel;

        if (remaining <= 0) {
            countdownText = "today";
            countdownLabel = "the day";
        } else {
            countdownText = remaining;
            countdownLabel = remaining === 1 ? "day to go" : "days to go";
        }

        document.body.innerHTML = `
            <div class="success-page" id="successPage">
                <div class="success-wrap">
                    <div class="eyebrow">Ticket Confirmed</div>

                    <div class="ticket">
                        <div class="ticket-main">
                            <div class="stamp">Confirmed<br>❤</div>
                            <div class="ticket-brand">Admit Two</div>
                            <div class="ticket-title">It's a Date, Chamuuu 🎉</div>

                            <div class="ticket-row">
                                <div class="ticket-field">
                                    <div class="label">Date</div>
                                    <div class="value">${prettyDate}</div>
                                </div>
                                <div class="ticket-field">
                                    <div class="label">Venue</div>
                                    <div class="value">${place}</div>
                                </div>
                            </div>

                            ${message ? `
                            <div class="ticket-note">
                                <span class="label">A note from you</span>
                                "${message}"
                            </div>` : ""}
                        </div>

                        <div class="ticket-stub">
                            <div class="countdown-number">${countdownText}</div>
                            <div class="countdown-label">${countdownLabel}</div>
                            <div class="stub-heart">💕</div>
                        </div>
                    </div>

                    <div class="success-footer">I can't wait to see you My Love😊❤️</div>
                </div>
            </div>
        `;

        launchConfetti(document.getElementById("successPage"));
